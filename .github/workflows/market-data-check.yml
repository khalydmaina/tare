name: Market data check

# Manual job for when the local network cannot reach the exchanges. From a GitHub runner it
# checks the exchanges, runs one live-loop cycle on real candles with the simulated trader
# (no keys, no orders), and can build a real scenario bank plus a cross-venue basis check.
on:
  workflow_dispatch:
    inputs:
      scenario_days:
        description: "Also build a real scenario bank over this many days (0 = skip)"
        default: "0"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCENARIO_DAYS: ${{ inputs.scenario_days }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pydantic pandas numpy pyyaml python-dotenv tenacity scipy httpx openai apscheduler

      - name: Exchange reachability
        run: |
          # Trader feed (Bitget), supported reference venues (OKX, Binance, Bybit), and other
          # candidates for a reference venue that also answers from US-hosted runners.
          check() {
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 20 "$@" || echo "000")
            printf '%-18s %s  %s\n' "$NAME" "$code" "$(head -c 90 /tmp/body 2>/dev/null | tr -d '\n')"
          }
          NAME="bitget perp";       check "https://api.bitget.com/api/v2/mix/market/candles?symbol=BTCUSDT&productType=USDT-FUTURES&granularity=15m&limit=2"
          NAME="binance perp";      check "https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=15m&limit=2"
          NAME="bybit perp";        check "https://api.bybit.com/v5/market/kline?category=linear&symbol=BTCUSDT&interval=15&limit=2"
          NAME="okx perp";          check "https://www.okx.com/api/v5/market/candles?instId=BTC-USDT-SWAP&bar=15m&limit=2"
          NAME="gate perp";         check "https://api.gateio.ws/api/v4/futures/usdt/candlesticks?contract=BTC_USDT&interval=15m&limit=2"
          NAME="kucoin perp";       check "https://api-futures.kucoin.com/api/v1/kline/query?symbol=XBTUSDTM&granularity=15"
          NAME="mexc perp";         check "https://contract.mexc.com/api/v1/contract/kline/BTC_USDT?interval=Min15"
          NAME="kraken futures";    check "https://futures.kraken.com/api/charts/v1/trade/PF_XBTUSD/15m"
          NAME="hyperliquid perp";  check -X POST -H "Content-Type: application/json" -d '{"type":"meta"}' "https://api.hyperliquid.xyz/info"
          NAME="binance spot data"; check "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=15m&limit=2"
          NAME="coinbase spot";     check "https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=900"
          NAME="kraken spot";       check "https://api.kraken.com/0/public/OHLC?pair=XBTUSDT&interval=15"

      - name: Symbols listed on both venues
        run: python scripts/list_symbols.py --top 30

      - name: One live cycle on real candles (simulated trader)
        run: python scripts/run_live.py --once --mock-llm --gate G2

      - name: What the cycle recorded
        run: |
          python - <<'EOF'
          import sqlite3
          db = sqlite3.connect("data/mock/tare.db")
          print("status:", db.execute("select status, note from bot_status").fetchone())
          for t in ("cycles", "setups", "proposals", "decisions", "orders", "shadow_positions"):
              print(f"{t:17s}", db.execute(f"select count(*) from {t}").fetchone()[0])
          print("regimes:", db.execute("select symbol, regime from cycles").fetchall())
          EOF

      - name: Cross-venue basis (sets C1's threshold)
        if: ${{ inputs.scenario_days != '0' }}
        run: python scripts/measure_basis.py --days 30

      - name: Build scenario bank
        if: ${{ inputs.scenario_days != '0' }}
        run: python scripts/build_scenarios.py --days "$SCENARIO_DAYS"

      - name: Upload scenario bank
        if: ${{ inputs.scenario_days != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: scenarios
          path: data/scenarios.jsonl
