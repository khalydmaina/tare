name: Attack suite

# Re-measures the attack table in docs/RESULTS.md with the real model, on the real scenario
# bank, and commits the result. The local network reaches neither the exchanges nor, reliably,
# the model, so this is where the published numbers come from.
#
# Answers already in data/llm_cache.json are reused, so a re-measurement after a gate change
# usually costs no model calls at all. "replay" makes that a hard rule: it fails rather than
# call the model, which is the mode to use when only the Inspector changed.
#
# On a free daily quota a measurement can take more than one run: max_calls stops a run before
# it spends the whole day's allowance (the live bot answers from the same model), the answers
# it did get are committed, and the next dispatch resumes. A run over part of the table fills
# the cache but never replaces the published table with that slice.
on:
  workflow_dispatch:
    inputs:
      attacks:
        description: "Attacks to run (add A5 for the adaptive attacker)"
        default: "A1,A2,A3,A4,A4F"
      gates:
        description: "Gate configs to compare"
        default: "G0,G1,G2A,G2"
      max_eval:
        description: "Cap on eval scenarios (0 = all)"
        default: "40"
      max_calls:
        description: "Stop before this many model calls (0 = no cap); leaves the live bot its share of the daily quota"
        default: "400"
      a5_subset:
        description: "A5: eval scenarios attacked"
        default: "20"
      a5_attempts:
        description: "A5: headline attempts per scenario"
        default: "6"
      replay:
        description: "Answer only from the cache; fail instead of calling the model"
        type: boolean
        default: false
      commit:
        description: "Commit the measured metrics and any new cached answers"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: attack-suite

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLM_API_KEY: ${{ contains(vars.LLM_BASE_URL, 'openrouter.ai') && secrets.OPENROUTER_API_KEY || secrets.LLM_API_KEY }}
      # Only read when LLM_BASE_URL points at AgentRouter, which is not OpenAI-compatible.
      AGENTIC_API_KEY: ${{ secrets.AGENTIC_API_KEY }}
      LLM_ROUTE_KEY: ${{ vars.LLM_ROUTE_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      # The table has to name the model that actually answered, so this is pinned to the
      # model the cache was built with rather than whatever the live bot is running today.
      # Through OpenRouter the same model is google/gemini-3.1-flash-lite, and its answers share
      # the cache with Google's endpoint (run_attacks.answer_identity).
      LLM_MODEL: ${{ vars.ATTACK_MODEL || (contains(vars.LLM_BASE_URL, 'openrouter.ai') && 'google/gemini-3.1-flash-lite' || 'gemini-3.1-flash-lite') }}
      # A5's attacker. Named explicitly here so it never silently becomes a scripted ladder;
      # it shares the Trader's key and endpoint unless ATTACKER_* are set.
      ATTACKER_API_KEY: ${{ secrets.ATTACKER_API_KEY || contains(vars.LLM_BASE_URL, 'openrouter.ai') && secrets.OPENROUTER_API_KEY || secrets.LLM_API_KEY }}
      ATTACKER_BASE_URL: ${{ vars.ATTACKER_BASE_URL || vars.LLM_BASE_URL }}
      ATTACKER_MODEL: ${{ vars.ATTACKER_MODEL || vars.ATTACK_MODEL || (contains(vars.LLM_BASE_URL, 'openrouter.ai') && 'google/gemini-3.1-flash-lite' || 'gemini-3.1-flash-lite') }}
      ATTACKS: ${{ inputs.attacks }}
      GATES: ${{ inputs.gates }}
      MAX_EVAL: ${{ inputs.max_eval }}
      MAX_CALLS: ${{ inputs.max_calls }}
      A5_SUBSET: ${{ inputs.a5_subset }}
      A5_ATTEMPTS: ${{ inputs.a5_attempts }}
      REPLAY: ${{ inputs.replay }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -q pydantic pandas numpy pyyaml python-dotenv tenacity scipy httpx openai apscheduler

      - name: Run the attack suite
        run: |
          if [ "$REPLAY" = "true" ]; then set -- --cache-only; fi
          python scripts/run_attacks.py \
            --llm real \
            --scenarios data/scenarios.jsonl \
            --cal-split 0.6 \
            --max-eval "$MAX_EVAL" \
            --attacks "$ATTACKS" \
            --gates "$GATES" \
            --max-calls "$MAX_CALLS" \
            --a5-subset "$A5_SUBSET" \
            --a5-attempts "$A5_ATTEMPTS" \
            "$@"

      - name: Show what changed
        if: always()
        run: git --no-pager diff --stat

      # Every answered call is progress worth keeping, even from a run that then hit a
      # quota wall: the cache is what lets the next run resume instead of starting over,
      # which is the only way through a daily free-tier limit. Metrics are different, and
      # are committed only when the run finished, so a thinned matrix cannot be published.
      - name: Commit the answers the model gave
        if: always() && inputs.commit
        run: |
          git config user.name "tare-bot"
          git config user.email "tare-bot@users.noreply.github.com"
          git add data/llm_cache.json
          if git diff --cached --quiet; then
            echo "no new answers to keep"
          else
            n=$(python -c "import json;print(len(json.load(open('data/llm_cache.json'))))")
            git commit -m "Cache $n model answers from the attack suite ($ATTACKS, ${LLM_MODEL})"
            git pull --rebase -q origin main || true
            git push
            echo "kept the cache at $n answers"
          fi

      - name: Commit the measurement
        if: success() && inputs.commit
        run: |
          git add docs/attack_metrics.json docs/attack_lab_demo.json \
                  web/public/attack_metrics.json web/public/attack_lab_demo.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Measure the attack suite: $ATTACKS over $GATES

          Model ${LLM_MODEL}, real scenario bank, run by the attack-suite workflow."
            git pull --rebase -q origin main || true
            git push
          fi
