llm:
  base_url: "https://api.x.ai/v1"
  model: "grok-4.5"
  api_key_env: "XAI_API_KEY"
  temperature: 0.2
  max_retries: 2
  ablation_probe: true   # M2: re-ask with sentiment stripped (G2 only)
  prompt_version: "trader_v2"   # trader/prompts/<version>.txt; v2 fixes SL/TP to the SMC setup

market:
  # Crypto perpetuals listed on Bitget and OKX both (scripts/list_symbols.py), by turnover.
  # Bitget's tokenized stock and commodity perps are deliberately left out: they stop trading
  # at the closing bell, which breaks a 24/7 setup finder and the volatility regime with it.
  symbols: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT, DOGEUSDT, BNBUSDT, ADAUSDT, AVAXUSDT, LINKUSDT, LTCUSDT,
            ZECUSDT, HYPEUSDT, SUIUSDT, NEARUSDT, ENAUSDT, PEPEUSDT, UNIUSDT, WLDUSDT, ONDOUSDT,
            ARBUSDT, TAOUSDT, DOTUSDT]
  entry_tf: 15m
  bias_tfs: [1h, 4h]
  reference_venue: "okx"   # second venue for C1 (okx | binance | bybit); Binance and Bybit refuse US-hosted servers
  candle_limit: 200
  sentiment_lookback_hours: 6
  stale_intervals: 2

calibration:
  buckets: [[50, 59], [60, 69], [70, 79], [80, 89], [90, 100]]
  regimes: 3
  min_n: 20
  prior_p: 0.35
  timeout_bars: 48

anomaly:
  veto_threshold: 0.7
  penalty: 0.5
  cross_venue_max_dev: 0.003
  sentiment_z_soft: 2.5
  confidence_jump_soft: 20
  weights: {S2: 0.2, S3: 0.2, S4: 0.2, C2: 0.2, M1: 0.2}

gate:
  edge_margin: 0.03
  kelly_scale: 0.25
  base_risk: 0.01
  # A confidence bucket with fewer than calibration.min_n outcomes has not been measured,
  # so p_cal is only the prior and there is nothing to size a full position from. Trades
  # there are exploration: minimum risk, on a daily budget, recorded as probe_uncalibrated.
  # A bucket that has reached min_n and still shows no edge is vetoed for real.
  probe:
    enabled: true
    risk: 0.0025      # a quarter of base_risk
    max_per_day: 2
    # Exploration only on quiet inputs. Measured on the 40-scenario eval set: clean setups
    # that reached a probe scored 0.31-0.41 (the M1 soft check alone), while A4's steered
    # ones scored 0.60-0.66 (S2, M1 and M2 together). 0.5 sits in that gap. It is a
    # threshold picked on that sample, so it needs rechecking as the eval set grows.
    max_anomaly: 0.5
  min_risk: 0.002

smc:
  swing_lookback: 3
  displacement_atr_mult: 1.5
  sl_atr_buffer: 0.1
  min_rr: 1.5
  sl_atr_min: 0.5
  sl_atr_max: 3.0
  dead_market_atr_percentile: 10

execution:
  slippage_bps: 5
  fee_bps: 4
  lot_step: 0.001
  paper_mode: true
  # Book of record. "sim" fills on the same public candles the labeler scores outcomes
  # against, at the slippage and fees above. "bitget-demo" routes to the Bitget demo
  # exchange, measured 2026-09-12: it does not list ZEC, SUI, ENA, WLD, ONDO, ARB or TAO
  # perps at all, and its thin book filled a test LTC short 3% away from the public market,
  # which is 60x the modelled slippage, so a demo-filled book cannot be scored against
  # public candles. See docs/RESULTS.md.
  fills: sim

recorder:
  db_path: "data/tare.db"

dashboard:
  refresh_seconds: 15
