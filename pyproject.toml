[project]
name = "tare"
version = "0.1.0"
description = "AI trader with brakes that tighten where the model has proven untrustworthy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pandas>=2.0",
  "numpy>=1.26",
  "apscheduler>=3.10",
  "openai>=1.40",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "tenacity>=8.0",
  "scipy>=1.11",
  "streamlit>=1.30",
  "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "data*", "trader*", "inspector*", "execution*", "recorder*", "backtest*", "attacks*", "dashboard*"]
